name: deploy to ec2
on:
  push:
      branches:
        - main


jobs:
   deploy:
      runs_on:ubuntu_latest
   steps:
      - name: checkout code
        uses: actions/checkout@v6       #this will check the github code
      # next step do ssh
      - name: deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
            host: ${{secrets.SSH_HOST}}       #we will get the host from this, this is written to keep the github thing secret like env.
            username: ubuntu
            key: ${{secrets.SSH_KEY}}
            script: |     
                cd ~/level5
                git pull
                sudo docker compose down
                sudo docker compose up -d --build


          
